name: UrbanPulse Daily Refresh Pipeline

on:
  schedule:
    # Runs daily at 03:00 UTC (08:30 IST)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run End-to-End Lakehouse Pipeline
        run: |
          # Runs full 60-day ingestion, bronze, silver idempotent merge, dbt quality gates, gold marts, and ML forecast
          python pipeline/run_pipeline.py --backfill-days 60

      - name: Commit and Push Updated Snapshots
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions [UrbanPulse Bot]"
          git add dashboard/public/data/ data/sample/ pipeline/ml/models/
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): automated daily lakehouse refresh [skip ci]"
            git push
          fi
